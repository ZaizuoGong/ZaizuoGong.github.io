<html lang="zh-CN" data-page-node-id="9lykjKKwWzJfyspm4aagPK">
<head data-page-node-id="D9olGSMvdbcefJpoAnQuuy">
<meta charset="UTF-8" data-page-node-id="cOb1FzjHUQBbVruO2gxaSw">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-page-node-id="SRCt3b9IGVw7OmkNWg9GTA">
<title>电力行业信息工作台</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --line:#e3e7ec; --ink:#1f2733; --sub:#6b7684; --faint:#98a2b0;
  --blue:#185fa5; --blue-bg:#e6f1fb; --red:#a32d2d; --red-bg:#fcebeb; --teal:#0f6e56; --teal-bg:#e1f5ee;
  --amber:#854f0b; --amber-bg:#faeeda; --gray:#5f5e5a; --gray-bg:#f1efe8;
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  font-size:14px;line-height:1.6;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}

/* 顶栏 */
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0 12px}
.h-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.logo svg{flex:none}
.h-meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.btn:active{background:var(--bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{border-color:transparent;color:var(--sub)}
.btn.danger{color:var(--red);border-color:var(--red-bg)}

/* Tab（PC 顶部） */
nav.tabs{display:flex;gap:4px;margin:12px 0 0}
nav.tabs button{border:none;background:none;padding:10px 16px;font-size:15px;color:var(--sub);
  border-radius:10px 10px 0 0;cursor:pointer;min-height:44px}
nav.tabs button.on{color:var(--blue);font-weight:600;background:var(--bg)}
nav.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
nav.tabs button .n.zero{background:var(--faint)}

/* 卡片与条目 */
.panel{padding:16px 0 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:18px 0 10px}
.sec-title:first-child{margin-top:0}
.sec-title .cnt{font-weight:400;color:var(--sub);font-size:13px}
.hint{font-size:13px;color:var(--sub);background:var(--blue-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.hint.warn{background:var(--red-bg);color:var(--red)}

.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.item.read .i-title{color:var(--sub)}
.i-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:500}
.b-政策{background:var(--blue-bg);color:var(--blue)} .b-交易公告{background:var(--red-bg);color:var(--red)}
.b-数据{background:var(--teal-bg);color:var(--teal)} .b-监管公告{background:var(--amber-bg);color:var(--amber)}
.b-市场动态{background:var(--gray-bg);color:var(--gray)}
.src{font-size:12px;color:var(--sub)}
.dt{font-size:12px;color:var(--faint);margin-left:auto}
.star{margin-left:6px}
/* 星级：基础星(金) + 关键词加成星(红，一眼区分) */
.stars{font-size:12px;letter-spacing:1px;white-space:nowrap}
.star-base{color:#ef9f27}
.star-bonus{color:#e24b4a}
/* 关键词命中条目：左侧红条 + 淡底，便于扫读 */
.item.kw-hit{border-left:3px solid var(--red);background:linear-gradient(90deg,var(--red-bg) 0,transparent 60px)}
.item.kw-hit .i-title a{font-weight:500}
.sec-title.kw-group{color:var(--red)}
.sec-title.kw-group .cnt{color:var(--red)}
.i-title{font-size:15px;font-weight:500;line-height:1.5}
.i-title a{color:var(--ink)}
.item.read .i-title a{color:var(--sub)}
.i-title a:hover{color:var(--blue)}
.i-sum{font-size:13px;color:var(--sub);margin-top:5px}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
details.orig{margin-top:6px}
details.orig summary{cursor:pointer;font-size:12px;color:var(--faint);min-height:24px;display:flex;align-items:center}
details.orig p{font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px;
  max-height:180px;overflow:auto;word-break:break-all}
.i-ops{display:flex;gap:6px;margin-top:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 10px;font-size:12px;
  color:var(--sub);cursor:pointer;min-height:30px}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}

/* 日期导航（今日简报） */
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.datebar select{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;
  font-size:14px;background:var(--card);color:var(--ink);max-width:200px}
.datebar .btn{min-height:40px;padding:4px 12px;font-size:14px}
.datebar .cur{font-size:12px;color:var(--sub);margin-left:auto}

/* 筛选行 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;
  font-size:16px;background:var(--card);color:var(--ink)}
.filters input[type=text]{flex:1;min-width:180px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat .v{font-size:20px;font-weight:600}
.stat .l{font-size:12px;color:var(--sub)}

/* 关键词管理 */
.kw-add{display:flex;gap:8px;margin-bottom:14px}
.kw-add input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.kw-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kw{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--blue);
  border-radius:16px;padding:5px 8px 5px 14px;font-size:14px}
.kw button{border:none;background:none;color:inherit;font-size:15px;cursor:pointer;padding:2px 6px;min-width:30px;min-height:30px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}

/* 移动端底部 Tab */
.mtabs{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:50}
.mtabs button{flex:1;border:none;background:none;padding:8px 0 6px;font-size:12px;color:var(--sub);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.mtabs button.on{color:var(--blue)}
.mtabs svg{width:22px;height:22px}
@media (max-width:768px){
  nav.tabs{display:none}
  .mtabs{display:flex}
  .h-actions .btn{min-height:36px;padding:4px 10px;font-size:13px}
  .i-title{font-size:16px}
}
@media (min-width:769px){ .mtabs{display:none} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:rgba(31,39,51,.92);color:#fff;border-radius:10px;padding:8px 18px;font-size:13px;z-index:99;
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<script>
/* ================= 数据与状态 ================= */
var DATA = (window.POWER_DATA && window.POWER_DATA.items) ? window.POWER_DATA.items : [];
var GEN_AT = window.POWER_DATA ? window.POWER_DATA.generated_at : "";
var WEEKLY = (window.POWER_DATA && window.POWER_DATA.weekly) ? window.POWER_DATA.weekly : [];
var LS_PREFIX = "wb_powerinfo_";
function lsGet(k, d){ try{ var v = localStorage.getItem(LS_PREFIX+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k, v){ try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); }catch(e){} }

var state = {
  tab: "brief",
  viewDate: null,   /* null = 自动（今日或最新数据日）；否则为用户选定的查看日期 */
  viewWeek: null,   /* null = 最新一周；否则为用户选定的周一日期 "YYYY-MM-DD" */
  read: lsGet("read", {}),
  stars: lsGet("stars", {}),
  keywords: lsGet("keywords", ["辽宁", "现货", "中长期", "新能源入市", "电价"]),
  q: "", cat: "全部", src: "全部", range: 90
};

function isRead(it){ return !!state.read[it.id]; }
function isStar(it){ return !!state.stars[it.id]; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function kwHit(it){
  var t = it.title + " " + (it.summary||"");
  for (var i=0;i<state.keywords.length;i++){ if(t.indexOf(state.keywords[i])>=0) return state.keywords[i]; }
  return null;
}
function hl(text){
  var s = text || "";
  if (state.keywords.length){
    for (var i=0;i<state.keywords.length;i++){
      var k = state.keywords[i]; if(!k) continue;
      try{ s = s.split(k).join("<mark>"+k+"</mark>"); }catch(e){}
    }
  }
  return s;
}
/* ---------- 有效星级：原始重要性 + 关键词命中加成 ---------- */
var KW_BONUS = 2;      /* 命中关键词加 2 星 */
var STAR_MAX = 5;      /* 有效星级上限 5 星 */
function kwHitCount(it){
  var t = (it.title||"") + " " + (it.summary||"") + " " + (it.excerpt||"");
  var n = 0;
  for (var i=0;i<state.keywords.length;i++){
    var k = state.keywords[i]; if(!k) continue;
    if (t.indexOf(k) >= 0) n++;
  }
  return n;
}
function effStars(it){
  /* 排序与展示共用的有效星级：重要性(1-3) + 命中加成，封顶 5 */
  var base = it.importance || 0;
  var bonus = kwHit(it) ? KW_BONUS : 0;
  var v = base + bonus;
  return v > STAR_MAX ? STAR_MAX : v;
}
function starStr(n){
  var s = "";
  for (var i=0;i<n;i++) s += "★";
  return s;
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ================= 计算层（纯过滤，不碰 DOM） ================= */
function latestDate(){
  var m = "";
  for (var i=0;i<DATA.length;i++){ if(DATA[i].date > m) m = DATA[i].date; }
  return m;
}
function datesAvailable(){
  /* 所有已采集数据的日期，降序去重 */
  var s = {};
  for (var i=0;i<DATA.length;i++) s[DATA[i].date] = (s[DATA[i].date]||0)+1;
  return Object.keys(s).sort().reverse();
}
function briefViewDate(){
  /* 实际展示的日期：用户选定 > 今日(有数据) > 最新数据日 */
  var t = todayStr(), latest = latestDate();
  if (state.viewDate) return state.viewDate;
  return ((unreadOfDate(t).length || itemsOfDate(t).length) ? t : latest);
}
function itemsOfDate(d){
  var arr = DATA.filter(function(it){ return it.date === d; });
  arr.sort(function(a,b){
    var ea = effStars(a), eb = effStars(b);
    if (eb !== ea) return eb - ea;                       /* 有效星级优先（含关键词加成） */
    var ha = kwHitCount(a), hb = kwHitCount(b);
    if (hb !== ha) return hb - ha;                       /* 同星级：命中词数多者靠前 */
    if (!!b.official !== !!a.official) return b.official?1:-1;
    return (b.date>a.date)?1:-1;
  });
  return arr;
}
function unreadOfDate(d){ return itemsOfDate(d).filter(function(it){ return !isRead(it); }); }

/* ---------- 周报精编：周计算 ---------- */
function weekStartOf(dateStr){
  var p = dateStr.split("-");
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  var off = (d.getDay() + 6) % 7;   /* 周一为一周起点 */
  d.setDate(d.getDate() - off);
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function weekEndOf(weekStartStr){
  var p = weekStartStr.split("-");
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  d.setDate(d.getDate() + 6);
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function fmtMD(dateStr){ return dateStr.slice(5).replace("-", "/"); }
function weeksAvailable(){
  var s = {};
  for (var i=0;i<DATA.length;i++){ var ws = weekStartOf(DATA[i].date); s[ws] = (s[ws]||0)+1; }
  return Object.keys(s).sort().reverse();
}
function itemsOfWeek(weekStartStr){
  var we = weekEndOf(weekStartStr);
  return DATA.filter(function(it){ return it.date >= weekStartStr && it.date <= we; })
    .sort(function(a,b){
      var ea = effStars(a), eb = effStars(b);
      if (eb !== ea) return eb - ea;                     /* 有效星级优先（含关键词加成） */
      var ha = kwHitCount(a), hb = kwHitCount(b);
      if (hb !== ha) return hb - ha;
      return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
    });
}
function weeklyDigestOf(weekStartStr){
  for (var i=0;i<WEEKLY.length;i++){ if (WEEKLY[i].week_start === weekStartStr) return WEEKLY[i]; }
  return null;
}
function libItems(){
  var now = new Date();
  return DATA.filter(function(it){
    if (state.cat !== "全部" && it.category !== state.cat) return false;
    if (state.src !== "全部" && it.source !== state.src) return false;
    if (state.range > 0){
      var diff = (now - new Date(it.date)) / 86400000;
      if (diff > state.range) return false;
    }
    if (state.q){
      var q = state.q.toLowerCase();
      var hay = (it.title+" "+(it.summary||"")+" "+it.source).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a,b){
    var ea = effStars(a), eb = effStars(b);
    if (eb !== ea) return eb - ea;                       /* 有效星级优先（含关键词加成） */
    return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
  });
}

/* ================= 渲染层（互不调用，统一由 refreshAll 调度） ================= */
function itemHTML(it, opts){
  opts = opts || {};
  var hit = kwHit(it);
  var eff = effStars(it);
  var base = it.importance || 0;
  var imp = "";
  if (eff){
    imp = '<span class="stars" title="重要度 '+base+' 星'+(hit?' + 关键词命中加成 '+(eff-base)+' 星':'')+'">'
        + '<span class="star-base">'+starStr(base)+'</span>'
        + (eff>base ? '<span class="star-bonus">'+starStr(eff-base)+'</span>' : "")
        + '</span>';
  }
  var sum = it.summary ? hl(esc(it.summary))
    : (it.excerpt ? '<span style="color:var(--faint)">摘要生成中 · </span>'+hl(esc(it.excerpt.slice(0,120)))+"…" : "");
  return '<div class="item'+(isRead(it)?" read":"")+(hit?" kw-hit":"")+'" data-id="'+it.id+'">'
    + '<div class="i-top"><span class="badge b-'+esc(it.category)+'">'+esc(it.category)+'</span>'
    + '<span class="src">'+esc(it.source)+'</span>'
    + imp
    + (hit?'<span class="badge b-交易公告">关键词:'+esc(hit)+'</span>':"")
    + '<span class="dt">'+it.date+'</span></div>'
    + '<div class="i-title"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+hl(esc(it.title))+'</a></div>'
    + (sum?'<div class="i-sum">'+sum+'</div>':"")
    + (it.excerpt?'<details class="orig"><summary>查看原文摘录</summary><p>'+esc(it.excerpt)+'</p></details>':"")
    + '<div class="i-ops">'
    + '<button class="chip" data-act="read">'+(isRead(it)?"已读 ✓":"标记已读")+'</button>'
    + '<button class="chip'+(isStar(it)?" on":"")+'" data-act="star">'+(isStar(it)?"★ 已收藏":"☆ 收藏")+'</button>'
    + '<a class="chip" href="'+esc(it.url)+'" target="_blank" rel="noopener">原文链接 ↗</a>'
    + '</div></div>';
}

function renderHeader(){
  var unread = 0;
  var latest = latestDate();
  for (var i=0;i<DATA.length;i++){ if(!state.read[DATA[i].id]) unread++; }
  document.getElementById("mSync").textContent = "数据更新：" + (GEN_AT || "—");
  document.getElementById("mCount").textContent = "共 " + DATA.length + " 条";
  document.getElementById("mUnread").textContent = "未读 " + unread;
  document.getElementById("mKw").textContent = "最新数据日：" + latest;
  var n = unreadOfDate(briefViewDate()).length;
  var el = document.getElementById("nBrief");
  el.textContent = n; el.className = "n" + (n?"":" zero");
}

function renderBrief(){
  var t = todayStr(), latest = latestDate();
  var use = briefViewDate();
  var items = itemsOfDate(use), unreads = unreadOfDate(use);
  var dates = datesAvailable();
  var isHist = state.viewDate && state.viewDate !== t;

  /* 日期选择器 */
  var sel = document.getElementById("selDate");
  var opts = "";
  for (var di=0;di<dates.length;di++){
    opts += '<option value="'+dates[di]+'"'+(dates[di]===use?" selected":"")+'>'+dates[di]
      +'（'+itemsOfDate(dates[di]).length+'条）</option>';
  }
  if (dates.indexOf(t) < 0) opts += '<option value="'+t+'"'+(!state.viewDate?" selected":"")+'>'+t+'（暂无数据）</option>';
  sel.innerHTML = opts;
  var diCur = dates.indexOf(use);
  document.getElementById("datebarInfo").textContent = isHist
    ? "正在回看历史日期，点击“回到最新”返回" : ("共采集 " + dates.length + " 个数据日");

  var top = "";
  if (isHist){
    top += '<div class="hint warn">正在查看 <b>'+use+'</b> 的历史简报（共 '+items.length+' 条）。'
      + '最新数据日为 <b>'+latest+'</b>，点击上方“回到最新”返回。</div>';
  } else if (use !== t){
    top += '<div class="hint warn">今日（'+t+'）暂无新信息，以下为最近一个数据日 <b>'+use+'</b> 的内容，'
      + '数据每日早上自动更新，可点击右上角刷新或等待下一次采集。</div>';
  }
  var hits = unreads.filter(kwHit);
  if (hits.length){
    top += '<div class="hint">'+(isHist?"该日":"今日")+'有 <b>'+hits.length+'</b> 条信息命中你的关键词（'+esc(state.keywords.join("、"))+'），已在下方标注，请注意查看。</div>';
  }
  top += '<div class="sec-title">'+(use===t?"今日":use)+'要闻<span class="cnt">'
    + '共 '+items.length+' 条 · 未读 '+unreads.length+' 条</span></div>';
  if (unreads.length){
    top += '<div style="display:flex;gap:8px;margin-bottom:10px">'
      + '<button class="btn" id="btnReadAll">全部标为已读</button></div>';
  }
  var html = "";
  if (!items.length){
    html = '<div class="card empty">该日暂无数据。请确认 crawler.py 已运行并生成 data.js。</div>';
  } else {
    for (var i=0;i<items.length;i++) html += itemHTML(items[i]);
  }
  document.getElementById("briefTop").innerHTML = top;
  document.getElementById("briefList").innerHTML = html;
  var btn = document.getElementById("btnReadAll");
  if (btn) btn.onclick = function(){
    var arr = itemsOfDate(use);
    for (var i=0;i<arr.length;i++) state.read[arr[i].id] = 1;
    lsSet("read", state.read); refreshAll(); toast("已全部标为已读");
  };
}

function renderLibrary(){
  var cats = {}, srcs = {};
  for (var i=0;i<DATA.length;i++){ cats[DATA[i].category]=(cats[DATA[i].category]||0)+1; srcs[DATA[i].source]=1; }
  var stats = '<div class="stat"><div class="v">'+DATA.length+'</div><div class="l">库内总条数</div></div>';
  ["政策","交易公告","数据","监管公告","市场动态"].forEach(function(c){
    if (cats[c]) stats += '<div class="stat"><div class="v">'+cats[c]+'</div><div class="l">'+c+'</div></div>';
  });
  var sel = document.getElementById("fSrc");
  var cur = state.src;
  var opts = '<option value="全部">全部来源</option>';
  Object.keys(srcs).sort().forEach(function(s){ opts += '<option'+(s===cur?" selected":"")+'>'+esc(s)+'</option>'; });
  sel.innerHTML = opts;

  var list = libItems();
  var html = list.length ? "" : '<div class="card empty">没有符合筛选条件的信息</div>';
  for (var j=0;j<list.length;j++) html += itemHTML(list[j]);
  document.getElementById("libStats").innerHTML = stats;
  document.getElementById("libList").innerHTML =
    '<div class="sec-title">筛选结果<span class="cnt">'+list.length+' 条</span></div>' + html;
}

function renderFav(){
  var list = DATA.filter(function(it){ return isStar(it); })
    .sort(function(a,b){
      var ea = effStars(a), eb = effStars(b);
      if (eb !== ea) return eb - ea;
      return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
    });
  var html = "";
  if (!list.length){
    html = '<div class="card empty">收藏夹是空的 —— 在「今日简报」「信息库」等页面点击 <b>☆ 收藏</b>，收藏的信息会汇总到这里，随时取用。</div>';
  } else {
    html = '<div class="sec-title">我的收藏</div>';
    for (var j=0;j<list.length;j++) html += itemHTML(list[j]);
  }
  document.getElementById("favList").innerHTML = html;
}

function renderKeywords(){
  var html = "";
  if (!state.keywords.length) html = '<span style="color:var(--faint);font-size:13px">尚未添加关键词</span>';
  for (var i=0;i<state.keywords.length;i++){
    html += '<span class="kw">'+esc(state.keywords[i])+'<button data-kwi="'+i+'" title="删除">×</button></span>';
  }
  document.getElementById("kwList").innerHTML = html;
  document.getElementById("kwCnt").textContent = state.keywords.length + " 个";

  var hits = DATA.filter(kwHit);
  var h = hits.length ? "" : '<div class="card empty">近 90 天没有命中关键词的信息</div>';
  var n = 0;
  for (var j=0;j<hits.length && n<120;j++){ h += itemHTML(hits[j]); n++; }
  document.getElementById("kwHits").innerHTML = h;
  document.getElementById("kwHitCnt").textContent = hits.length + " 条（最多显示 120）";
}

/* ================= 周报精编 ================= */
function weeklyViewStart(){
  var weeks = weeksAvailable();
  return state.viewWeek || weeks[0] || "";
}
function renderWeekly(){
  var weeks = weeksAvailable();
  var ws = weeklyViewStart();
  var we = weekEndOf(ws);
  var items = itemsOfWeek(ws);
  var dig = weeklyDigestOf(ws);

  /* 周选择器 */
  var sel = document.getElementById("selWeek");
  var opts = "";
  for (var wi=0;wi<weeks.length;wi++){
    opts += '<option value="'+weeks[wi]+'"'+(weeks[wi]===ws?" selected":"")+'>'
      + weeks[wi].slice(0,4)+'年 '+fmtMD(weeks[wi])+' ~ '+fmtMD(weekEndOf(weeks[wi]))
      + '（'+itemsOfWeek(weeks[wi]).length+'条）</option>';
  }
  sel.innerHTML = opts;
  document.getElementById("weekbarInfo").textContent = weeks.length ? ("共采集 " + weeks.length + " 周") : "";

  var html = "";

  /* AI 周综述 */
  if (dig && dig.summary){
    html += '<div class="card" style="border-left:4px solid var(--blue)">'
      + '<div class="sec-title" style="margin-top:0">本周综述'
      + '<span class="cnt">生成于 ' + esc(dig.generated_at || "") + '</span></div>'
      + '<p style="font-size:14px;line-height:1.9;white-space:pre-wrap">' + esc(dig.summary) + '</p>';
    if (dig.highlights && dig.highlights.length){
      html += '<div class="sec-title" style="font-size:14px">一周要点</div><ol style="padding-left:20px">';
      for (var hi=0;hi<dig.highlights.length;hi++){
        var h = dig.highlights[hi];
        html += '<li style="margin-bottom:6px"><b>' + esc(h.title) + '</b>'
          + (h.note ? '<span style="color:var(--sub);font-size:13px"> — ' + esc(h.note) + '</span>' : '') + '</li>';
      }
      html += '</ol>';
    }
    html += '</div>';
  } else {
    html += '<div class="hint">本周 AI 综述尚未生成（每周一上午自动生成上一周综述），以下为该周数据自动汇总。</div>';
  }

  /* 概览统计 */
  var cats = {}, official = 0, kwHits = 0;
  for (var i=0;i<items.length;i++){
    cats[items[i].category] = (cats[items[i].category]||0)+1;
    if (items[i].official) official++;
    if (kwHit(items[i])) kwHits++;
  }
  html += '<div class="stats">'
    + '<div class="stat"><div class="v">'+items.length+'</div><div class="l">本周总条数</div></div>'
    + '<div class="stat"><div class="v">'+(cats["政策"]||0)+'</div><div class="l">政策</div></div>'
    + '<div class="stat"><div class="v">'+(cats["交易公告"]||0)+'</div><div class="l">交易公告</div></div>'
    + '<div class="stat"><div class="v">'+(cats["数据"]||0)+'</div><div class="l">数据</div></div>'
    + '<div class="stat"><div class="v">'+official+'</div><div class="l">官方来源</div></div>'
    + '<div class="stat"><div class="v">'+kwHits+'</div><div class="l">关键词命中</div></div>'
    + '</div>';

  /* 分组呈现：按有效星级（含关键词加成）分组，命中条目优先置顶 */
  function group(title, arr, cls){
    if (!arr.length) return "";
    var s = title ? '<div class="sec-title'+(cls?" "+cls:"")+'">'+title+'<span class="cnt">'+arr.length+' 条</span></div>' : "";
    for (var j=0;j<arr.length;j++) s += itemHTML(arr[j]);
    return s;
  }
  var hitItems = items.filter(function(it){ return kwHit(it); });
  var rest0 = items.filter(function(it){ return !kwHit(it); });
  var key = rest0.filter(function(it){ return (it.importance||0) >= 3; });
  var pol = rest0.filter(function(it){ return it.importance===2 && (it.category==="政策" || it.category==="监管公告"); });
  var trade = rest0.filter(function(it){ return it.importance===2 && it.category==="交易公告"; });
  var data2 = rest0.filter(function(it){ return it.category==="数据"; });
  var rest = rest0.filter(function(it){ return it.importance<2; });

  html += group("★ 关键词命中（" + esc(state.keywords.join("、")) + "）", hitItems.slice(0, 30), "kw-group");
  html += group("重点政策与公告（★★★）", key.slice(0, 30));
  html += group("其他政策与监管动态", pol.slice(0, 20));
  html += group("交易相关", trade.slice(0, 20));
  html += group("数据速览", data2.slice(0, 15));
  if (rest.length){
    html += '<details style="margin:12px 0"><summary style="cursor:pointer;color:var(--sub);font-size:13px;min-height:32px;display:flex;align-items:center">'
      + '一般市场动态（'+rest.length+' 条，点击展开）</summary>'
      + group("", rest.slice(0, 60)) + '</details>';
  }
  if (!items.length){
    html = '<div class="card empty">该周暂无数据。</div>';
  }
  document.getElementById("weeklyBody").innerHTML = html;
}

/* ================= 统一刷新入口 ================= */
function refreshAll(){
  renderHeader();
  renderBrief();
  renderWeekly();
  renderLibrary();
  renderFav();
  renderKeywords();
}

/* ================= 事件层 ================= */
function switchTab(tab){
  state.tab = tab;
  var secs = {brief:"tab-brief", weekly:"tab-weekly", lib:"tab-lib", fav:"tab-fav", kw:"tab-kw"};
  Object.keys(secs).forEach(function(k){
    document.getElementById(secs[k]).style.display = (k===tab) ? "" : "none";
  });
  var btns = document.querySelectorAll("nav.tabs button, .mtabs button");
  for (var i=0;i<btns.length;i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-tab")===tab);
  window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  var tabBtn = e.target.closest ? e.target.closest("[data-tab]") : null;
  if (tabBtn){ switchTab(tabBtn.getAttribute("data-tab")); return; }

  var chip = e.target.closest ? e.target.closest(".chip[data-act]") : null;
  if (chip){
    var itemEl = chip.closest(".item");
    var id = itemEl ? itemEl.getAttribute("data-id") : null;
    if (!id) return;
    var act = chip.getAttribute("data-act");
    if (act === "read"){
      if (state.read[id]) delete state.read[id]; else state.read[id] = 1;
      lsSet("read", state.read);
    } else if (act === "star"){
      if (state.stars[id]) delete state.stars[id]; else state.stars[id] = 1;
      lsSet("stars", state.stars);
    }
    refreshAll();
    return;
  }

  var kwDel = e.target.closest ? e.target.closest(".kw button[data-kwi]") : null;
  if (kwDel !== null && kwDel){
    var idx = parseInt(kwDel.getAttribute("data-kwi"), 10);
    if (!isNaN(idx)){ state.keywords.splice(idx,1); lsSet("keywords", state.keywords); refreshAll(); }
  }
});

document.getElementById("fQ").addEventListener("input", function(){
  clearTimeout(window._qT);
  var v = this.value;
  window._qT = setTimeout(function(){ state.q = v.trim(); renderLibrary(); }, 250);
});

/* ===== 日期导航（今日简报） ===== */
function shiftDate(step){
  var dates = datesAvailable();
  if (!dates.length) return;
  var use = briefViewDate();
  var i = dates.indexOf(use);
  if (i < 0) i = 0;
  var j = i + step;   /* dates 为降序：step>0 向前翻=前一天(下标+1)，step<0 向后翻=后一天(下标-1) */
  if (j < 0 || j >= dates.length){ toast(step>0?"没有更早的数据日了":"没有更晚的数据日了"); return; }
  state.viewDate = dates[j];
  refreshAll();
}
document.getElementById("btnPrevDay").addEventListener("click", function(){ shiftDate(1); });
document.getElementById("btnNextDay").addEventListener("click", function(){ shiftDate(-1); });
document.getElementById("btnLatestDay").addEventListener("click", function(){
  state.viewDate = null; refreshAll(); toast("已回到最新数据日");
});
document.getElementById("selDate").addEventListener("change", function(){
  state.viewDate = this.value; refreshAll();
});
/* ===== 周导航（周报精编） ===== */
function shiftWeek(step){
  var weeks = weeksAvailable();
  if (!weeks.length) return;
  var ws = weeklyViewStart();
  var i = weeks.indexOf(ws);
  if (i < 0) i = 0;
  var j = i + step;   /* weeks 为降序：step>0 向前翻=上一周(下标+1)，step<0 向后翻=下一周(下标-1) */
  if (j < 0 || j >= weeks.length){ toast(step>0?"没有更早的周了":"没有更晚的周了"); return; }
  state.viewWeek = weeks[j];
  refreshAll();
}
document.getElementById("btnPrevWeek").addEventListener("click", function(){ shiftWeek(1); });
document.getElementById("btnNextWeek").addEventListener("click", function(){ shiftWeek(-1); });
document.getElementById("btnLatestWeek").addEventListener("click", function(){
  state.viewWeek = null; refreshAll(); toast("已回到最新一周");
});
document.getElementById("selWeek").addEventListener("change", function(){
  state.viewWeek = this.value; refreshAll();
});
document.getElementById("fCat").addEventListener("change", function(){ state.cat = this.value; renderLibrary(); });
document.getElementById("fSrc").addEventListener("change", function(){ state.src = this.value; renderLibrary(); });
document.getElementById("fRange").addEventListener("change", function(){ state.range = parseInt(this.value,10); renderLibrary(); });

function addKeyword(){
  var inp = document.getElementById("kwInput");
  var v = inp.value.trim();
  if (!v) return;
  if (state.keywords.indexOf(v) < 0){ state.keywords.push(v); lsSet("keywords", state.keywords); }
  inp.value = ""; refreshAll(); toast("已添加关键词：" + v);
}
document.getElementById("kwAdd").addEventListener("click", addKeyword);
document.getElementById("kwInput").addEventListener("keydown", function(e){ if (e.key==="Enter") addKeyword(); });

/* 导出 / 导入 */
document.getElementById("btnExport").addEventListener("click", function(){
  var payload = {
    exported_at: new Date().toString(),
    type: "power_workspace_backup",
    generated_at: GEN_AT,
    keywords: state.keywords, read: state.read, stars: state.stars,
    items: DATA
  };
  var blob = new Blob([JSON.stringify(payload, null, 1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "电力信息工作台备份_" + todayStr() + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("已导出备份");
});
document.getElementById("btnImport").addEventListener("click", function(){
  document.getElementById("fileImport").click();
});
document.getElementById("fileImport").addEventListener("change", function(){
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if (d.type !== "power_workspace_backup") throw new Error("格式不符");
      if (d.keywords) { state.keywords = d.keywords; lsSet("keywords", d.keywords); }
      if (d.read) { state.read = d.read; lsSet("read", d.read); }
      if (d.stars) { state.stars = d.stars; lsSet("stars", d.stars); }
      refreshAll(); toast("导入恢复完成");
    }catch(err){ toast("导入失败：" + err.message); }
    finally{ document.getElementById("fileImport").value = ""; }
  };
  r.readAsText(f, "utf-8");
});

var _toastT;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(_toastT); _toastT = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

/* ================= 初始化 ================= */
document.addEventListener("DOMContentLoaded", function(){
  if (!DATA.length){
    document.getElementById("briefList").innerHTML =
      '<div class="card empty">尚未加载到数据：请先运行 crawler.py 生成 data.js</div>';
  }
  refreshAll();
});
</script>
</body>
</html>
